[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoquest"
version = "0.1.0"
description = "A guided exploration game for unfamiliar code repositories"
requires-python = ">=3.10"

[project.optional-dependencies]
agent = ["openai-agents"]

[project.scripts]
repoquest = "repoquest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
